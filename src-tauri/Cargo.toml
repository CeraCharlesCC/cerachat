[package]
name = "cerachat"
version = "0.1.0"
description = "Deterministic local-first chat request compiler"
authors = ["CeraChat"]
edition = "2021"

[lib]
name = "cerachat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Tauri CLI enables this for production builds. Direct cargo build callers
# (such as the portable Windows CI job) must opt in explicitly as well.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
zstd = "0.13"
encoding_rs = "0.8"
chardetng = "0.1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
