name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # Keep this equal to playwright-core in package-lock.json.
        playwright: ['1.63.0']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Playwright image matches lockfile
        env:
          PLAYWRIGHT_IMAGE_VERSION: ${{ matrix.playwright }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages['node_modules/playwright-core'].version;
          if (version !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
            throw new Error(`Playwright ${version} requires updating the frontend job's playwright matrix version to match.`);
          }
          NODE

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test chat, context, and catalog workflows
        run: npm run test:e2e

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # CI needs diagnostics, but not large debug-symbol artifacts.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Rust
        # rustup installs the exact toolchain and components from the repository.
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows-portable:
    name: Windows portable build
    if: github.event_name != 'pull_request'
    # Build immediately; the workflow still fails if either check job fails.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          cache-bin: false

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build portable executable
        run: cargo build --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageDir = "CeraChat-windows-portable"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "src-tauri/target/release/cerachat.exe" "$packageDir/CeraChat.exe"
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip" -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeraChat-windows-portable
          path: CeraChat-windows-portable.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
